# Concord reads this to install and run Tukan. Admins never edit it: the
# settings below appear as forms in Concord (Server Settings > Plugins for
# server_config_field, the channel's own settings for create_field).

[plugin]
id = "Tukan"
name = "Tukan"
version = "0.2.0"            # release.go stamps the git tag here
description = "A kanban board in a channel, shared live by everyone viewing it."
source_url = "https://github.com/JMThomas00/Tukan"

[process]
restart_on_crash = true
max_restarts = 5
restart_backoff_seconds = 5

[process.entrypoint.linux]
bin = "tukan"
[process.entrypoint.darwin]
bin = "tukan"
[process.entrypoint.windows]
bin = "tukan.exe"

[[channel_kind]]
kind = "board"
display_name = "Kanban Board"
icon = "◱"
remote_pane = true

  [[channel_kind.create_field]]
  key = "board_name"
  label = "Board name"
  type = "text"
  help = "Shown at the top of the board; the channel's name if left empty"

[[server_config_field]]
key = "activity_notify_channel"
label = "Activity notification channel"
type = "channel_select"
help = "Where Tukan posts a line when a card is created, changed or deleted (none if empty)"

# Achievements and the leaderboard: Tukan counts the cards each member
# creates and finishes (moves into a Done lane); members see their record
# on Settings > About > Achievements.
[[achievement]]
id = "first_card"
name = "First Card"
description = "Create a card"
icon = "🗂"

[[achievement]]
id = "cards_25"
name = "Busy Bee"
description = "Create 25 cards"
tier = "silver"

[[achievement]]
id = "first_done"
name = "Done and Dusted"
description = "Move a card to Done"
tier = "bronze"

[[achievement]]
id = "done_10"
name = "Finisher"
description = "Finish ten cards"
tier = "silver"

[[achievement]]
id = "done_100"
name = "Shipping Machine"
description = "Finish a hundred cards"
tier = "gold"

[leaderboard]
stat = "finished"
label = "Cards finished"
